<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
<defs>
  <style>
    .wm  { font-family: 'DM Serif Display', Georgia, serif; }
    .mono{ font-family: 'DM Mono', 'Courier New', monospace; font-weight: 500; }
  </style>
</defs>

<!-- Background -->
<rect width="520" height="300" rx="4" fill="#0d0a04"/>

<!-- Survey grid -->
<line x1="0"   y1="60"  x2="520" y2="60"  stroke="#3a2c14" stroke-width="0.5"/>
<line x1="0"   y1="120" x2="520" y2="120" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="0"   y1="180" x2="520" y2="180" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="0"   y1="240" x2="520" y2="240" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="80"  y1="0"   x2="80"  y2="300" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="160" y1="0"   x2="160" y2="300" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="260" y1="0"   x2="260" y2="300" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="360" y1="0"   x2="360" y2="300" stroke="#3a2c14" stroke-width="0.5"/>
<line x1="440" y1="0"   x2="440" y2="300" stroke="#3a2c14" stroke-width="0.5"/>

<!-- Hex mark -->
<polygon points="260,18 330,58 330,138 260,178 190,138 190,58" fill="#050301"/>
<polygon points="260,18 330,58 330,138 260,178 190,138 190,58" fill="none" stroke="#e07830" stroke-width="2"/>
<polygon points="260,34 316,66 316,128 260,162 204,128 204,66" fill="none" stroke="#7a5c2c" stroke-width="0.8"/>
<polygon points="260,50 302,74 302,118 260,146 218,118 218,74" fill="none" stroke="#7a5c2c" stroke-width="0.6"/>

<!-- House -->
<polygon points="226,118 260,86 294,118" fill="#e07830"/>
<rect x="234" y="118" width="52" height="38" fill="#e07830"/>
<rect x="250" y="132" width="20" height="24" fill="#050301"/>
<rect x="273" y="96"  width="9"  height="19" fill="#e07830"/>
<line x1="226" y1="118" x2="294" y2="118" stroke="#7a5c2c" stroke-width="1.5"/>

<!-- Magnifier -->
<circle cx="316" cy="168" r="24" fill="#050301"/>
<circle cx="316" cy="168" r="24" fill="none" stroke="#e07830" stroke-width="2.5"/>
<circle cx="316" cy="168" r="15" fill="none" stroke="#7a5c2c" stroke-width="1"/>
<line x1="333" y1="185" x2="350" y2="202" stroke="#e07830" stroke-width="4" stroke-linecap="round"/>
<line x1="308" y1="168" x2="324" y2="168" stroke="#7a5c2c" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="316" y1="160" x2="316" y2="176" stroke="#7a5c2c" stroke-width="1" stroke-dasharray="2 2"/>

<!-- Wordmark -->
<text class="wm" fill="#f5ecd8" font-size="44" x="260" y="232" text-anchor="middle" letter-spacing="-1">Property Search</text>

<!-- Rule + subtitle -->
<line x1="20"  y1="248" x2="164" y2="248" stroke="#7a5c2c" stroke-width="0.8"/>
<line x1="356" y1="248" x2="500" y2="248" stroke="#7a5c2c" stroke-width="0.8"/>
<text class="mono" fill="#c89850" font-size="10" x="260" y="252" text-anchor="middle" letter-spacing="3">EXTRAORDINAIRE</text>

<!-- County -->
<text class="mono" fill="#7a5c2c" font-size="9" x="260" y="272" text-anchor="middle" letter-spacing="2">LARIMER · WELD · COLORADO</text>

<!-- Corner ticks -->
<line x1="8"   y1="8"   x2="22"  y2="8"   stroke="#7a5c2c" stroke-width="1"/>
<line x1="8"   y1="8"   x2="8"   y2="22"  stroke="#7a5c2c" stroke-width="1"/>
<line x1="512" y1="8"   x2="498" y2="8"   stroke="#7a5c2c" stroke-width="1"/>
<line x1="512" y1="8"   x2="512" y2="22"  stroke="#7a5c2c" stroke-width="1"/>
<line x1="8"   y1="292" x2="22"  y2="292" stroke="#7a5c2c" stroke-width="1"/>
<line x1="8"   y1="292" x2="8"   y2="278" stroke="#7a5c2c" stroke-width="1"/>
<line x1="512" y1="292" x2="498" y2="292" stroke="#7a5c2c" stroke-width="1"/>
<line x1="512" y1="292" x2="512" y2="278" stroke="#7a5c2c" stroke-width="1"/>
</svg>
