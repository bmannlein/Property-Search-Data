<circle cx="23" cy="24" r="5" fill="none" stroke="#e07830" stroke-width="1.5"/>
<line x1="27" y1="28" x2="30" y2="31" stroke="#e07830" stroke-width="2" stroke-linecap="round"/>
</svg>
